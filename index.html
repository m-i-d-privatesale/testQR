<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INVITATION - Private Sale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f3f3;
            font-family: 'Times New Roman', Georgia, Times, serif;
            color: #000000;
            -webkit-font-smoothing: antialiased;
        }

        .font-invitation,
        .font-serif-custom,
        .main-logo-text {
            font-family: 'Times New Roman', Georgia, Times, serif;
        }

        .font-invitation {
            letter-spacing: 0.15em;
        }

        /* Prevent text wrapping globally for designated invitation text classes */
        .nowrap {
            white-space: nowrap;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-2 sm:p-6" style="font-family: 'Times New Roman', Georgia, Times, serif;">

    <div class="w-full max-w-[560px] bg-white shadow-2xl px-4 py-10 sm:px-10 sm:py-14 text-center mx-auto my-auto overflow-hidden">
        
        <!-- Header: INVITATION -->
        <h1 class="font-invitation text-3xl sm:text-4xl uppercase tracking-[0.2em] font-normal mb-6 text-black nowrap">
            INVITATION
        </h1>

        <!-- Subtitle & Discount -->
        <div class="mb-8">
            <h2 class="font-serif-custom italic text-2xl sm:text-3xl font-normal mb-1 nowrap">
                Private Sale
            </h2>
            <p class="font-serif-custom text-xl sm:text-2xl tracking-widest font-light nowrap">
                30%-80%OFF
            </p>
        </div>

        <!-- Dates Section（max-wを320pxにし、gapを小さくして間隔を詰めました） -->
        <div class="flex justify-center items-start gap-6 sm:gap-10 max-w-[320px] mx-auto mb-8 text-black">
            <!-- Left Date (10/7 Wed.) -->
            <div class="text-center px-1">
                <div class="font-serif-custom flex items-baseline justify-center mb-1 nowrap">
                    <span class="text-3xl sm:text-4xl font-normal">10</span>
                    <span class="text-2xl sm:text-3xl font-light mx-0.5">/</span>
                    <span class="text-4xl sm:text-5xl font-normal">7</span>
                    <span class="text-sm sm:text-base font-normal ml-1">Wed.</span>
                </div>
                <div class="font-serif-custom text-xs sm:text-sm tracking-tight nowrap">
                    10:00-20:00
                </div>
            </div>

            <!-- Right Date (8 Thu.) -->
            <div class="text-center px-1">
                <div class="font-serif-custom flex items-baseline justify-center mb-1 nowrap">
                    <span class="text-4xl sm:text-5xl font-normal">8</span>
                    <span class="text-sm sm:text-base font-normal ml-2">Thu.</span>
                </div>
                <div class="font-serif-custom text-xs sm:text-sm tracking-tight nowrap">
                    10:00-19:00
                </div>
            </div>
        </div>

        <!-- Event Description & Map Placeholder Row -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 text-left mb-1">
            <!-- Left Text Block (No Wrap Line by Line) -->
            <div class="text-[12px] sm:text-[12.5px] leading-[1.8] tracking-tighter text-gray-900 font-normal">
                <p class="nowrap">上記期間にて、ご招待の方限定で</p>
                <p class="nowrap">プライベートセールを特別開催いたします。</p>
                <p class="nowrap">皆様のご来場を心よりお待ちしております。</p>
            </div>

            <!-- Right Map Area -->
            <div class="text-center">
            </div>
        </div>

        <!-- Company Address -->
        <div class="text-[10px] sm:text-[10.5px] tracking-tight text-black mb-6 nowrap">
            株式会社 PRESS ROOM        </div>

        <!-- Notices Area -->
        <center>
            <p style="margin:0; padding:0 20px; font-size:12px; color:#000000; line-height:1.5; font-family: 'Times New Roman', Georgia, Times, serif;">
                ※ご入場の際はこちらの画面をご提示くださいませ。<br>(ご同伴者2名様まで)<br>
                ※お支払いには各種クレジットカードがご使用になれます。<br>(一括払いのみ)
            </p>
            <br />
            <div style="border-bottom: 10px solid #000000; padding-bottom: 10px; margin-bottom: 20px;"></div>

            <!-- バナーのテーブル幅 -->
            <table cellpadding="0" cellspacing="0" style="width: 100%; margin: 0 auto;">
                <tr>
                    <td>
                    </td>
                </tr>
            </table>

            <table cellpadding="0" cellspacing="0" style="width: 100%; margin: 0 auto;">
                <tr>
                    <td><img src="http://www.m-i-d.co.jp/mailmag/vol36f/img/space.gif" height="80" alt="" style="display:block;"></td>
                </tr>
                <tr>
                    <td>
                        <table cellpadding="0" cellspacing="0" style="border-spacing: 0; border-collapse: collapse; background: #f4f4f4; padding: 0; text-align: left; width: 100%; color: #545454;">
                            <tr>
                                <td><img src="http://www.m-i-d.co.jp/mailmag/vol36f/img/space.gif" height="45" alt="" style="display:block;"></td>
                            </tr>
                            <br>
                            <tr>
                                <td>
                                    <div style="padding-top: 8px; font-family: 'Times New Roman',serif; letter-spacing: .08em; font-size: 12px; line-height: 175%;">
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td><img src="http://www.m-i-d.co.jp/mailmag/vol36f/img/space.gif" height="40" alt="" style="display:block;"></td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </center>
    </div>

</body>
</html>
